<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="estilos.css" /> 
</head>
<body>
    <div class="contenedor-registro">
        <h1>CREA UNA CUENTA NUEVA</h1>
        <form>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre">
            </div>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="campo">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            <div class="campo">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password">
            </div>
            <div class="campo">
                <label for="numero-telefono">Numero de telefono</label>
                <input type="tel" id="num-telefono" name="numero-telefono">
            </div>
            
            <button type="submit" class="boton-registro">REGISTRATE</button>
        </form>
         <div class="contenedor-boton-inicio">
            <a href="../index.html" class="boton-inicio">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
