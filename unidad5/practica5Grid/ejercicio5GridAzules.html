<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Pagina de Grid Azules</title>
</head>
<body class="min-h-screen grid  bg-gray-200">
    <div class="grid grid-cols-4 grid-rows-[180px_1fr_180px]
                gap-4 bg-white p-6 rounded-2xl max-w-7xl w-full min-h-[70vh]">

        <header class="col-span-4 bg-blue-500 rounded-3xl 
                        grid place-items-center">
            <p class="texto_blanco">Header Content</p>
        </header>
        <aside class=" bg-violet-600 rounded-2xl
                        grid place-items-center">
            <p class="texto_blanco">Side Content</p>
        </aside>
        <main class="col-span-3  bg-gray-400 w-230  rounded-2xl
                        grid place-items-center">
                <p class="texto_blanco">Main Content</p>
        </main>
        
        <footer class="col-span-4 bg-blue-800 rounded-2xl
                        grid place-items-center">
            <p class="texto_blanco">Footer Content</p>
        </footer>
    </div>
</body>
</html>
